plugins {
    id 'com.android.application'
}

// Set by platforms/android/package.sh: SDL's Java sources (SDL3-<v>/android-project/.../java) and the
// folder holding arm64-v8a/libmain.so, libSDL3.so, libc++_shared.so.
def sdlJava = project.property('sdlJava')
def jniDir = project.property('jniDir')
// Folder whose contents go into the APK's assets (wings/ from platforms/wings.sh), or empty.
def assetsDir = project.findProperty('assetsDir') ?: ''
// An extra resource folder (the launcher icon from assets/icon/icon.sh), or empty.
def resDir = project.findProperty('resDir') ?: ''


android {
    namespace = 'games.hazzard.heroes4'
    compileSdk = 35
    defaultConfig {
        applicationId = 'games.hazzard.heroes4'
        minSdk = 29
        targetSdk = 35
        // The release version (VERSION at the top of the repository; as platforms/env.sh: 0.1 -> 100).
        def v = new File(rootDir, '../../VERSION').text.trim()
        def m = v =~ /^(\d+)\.(\d+)(?:\.(\d+))?$/
        if (!m.matches()) throw new GradleException("VERSION is not MAJOR.MINOR[.PATCH]: " + v)
        versionCode = m.group(1).toInteger() * 10000 + m.group(2).toInteger() * 100 + (m.group(3) ?: '0').toInteger()
        versionName = v
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        java.srcDirs += [sdlJava]
        jniLibs.srcDirs = [jniDir]
        if (assetsDir) assets.srcDirs = [assetsDir]
        if (resDir) res.srcDirs += [resDir]
    }
    packagingOptions {
        // Compressed in the APK (68 MB -> ~25 MB to download); Android unpacks it once when the app
        // is installed (it then takes ~100 MB instead of ~72 MB on the device).
        jniLibs { useLegacyPackaging = true }
    }
    // The release key lives outside the repository: ~/.gradle/gradle.properties names it
    // (h4ReleaseStoreFile, h4ReleaseStorePassword, h4ReleaseKeyAlias). Every release must be signed
    // with it (its certificate: ../release-cert.sha256, checked by tools/release/make_release.sh),
    // or Android will not install the update over the old app. Without it the debug key signs:
    // fine for your own device, never for a release.
    def ks = findProperty('h4ReleaseStoreFile')
    signingConfigs {
        if (ks) release {
            storeFile file(ks)
            storePassword findProperty('h4ReleaseStorePassword')
            keyAlias findProperty('h4ReleaseKeyAlias') ?: 'rehomm4'
            keyPassword findProperty('h4ReleaseStorePassword')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint { abortOnError = false }
}
