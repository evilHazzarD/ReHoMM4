plugins {
    id 'com.android.application'
}

// Set by platforms/android/package.sh: SDL's Java sources (SDL3-<v>/android-project/.../java) and the
// folder holding arm64-v8a/libmain.so, libSDL3.so, libc++_shared.so.
def sdlJava = project.property('sdlJava')
def jniDir = project.property('jniDir')
// Folder whose contents go into the APK's assets (wings/ from platforms/wings.sh), or empty.
def assetsDir = project.findProperty('assetsDir') ?: ''
// An extra resource folder (the launcher icon from assets/icon/icon.sh), or empty.
def resDir = project.findProperty('resDir') ?: ''


android {
    namespace = 'games.hazzard.heroes4'
    compileSdk = 35
    defaultConfig {
        applicationId = 'games.hazzard.heroes4'
        minSdk = 29
        targetSdk = 35
        versionCode = 1
        versionName = '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        java.srcDirs += [sdlJava]
        jniLibs.srcDirs = [jniDir]
        if (assetsDir) assets.srcDirs = [assetsDir]
        if (resDir) res.srcDirs += [resDir]
    }
    packagingOptions {
        // The game's library is big; keep it uncompressed so it is mapped straight from the APK.
        jniLibs { useLegacyPackaging = false }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug  // sideloading only: the debug key is enough
        }
    }
    lint { abortOnError = false }
}
