// Heroes IV for Android: SDL's android-project, with the game as prebuilt libraries
// (platforms/build.sh android builds them, platforms/android/package.sh runs this).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
