name: converter core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'converter/**'
      - 'third_party/game-recomp'
      - 'web/src/dynamic_loader.mjs'
      - '.github/workflows/converter-core.yml'

permissions:
  contents: read

jobs:
  webassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Verify the ReHoMM4 WASM ABI
        run: node converter/test/emitter.mjs
      - name: Build the ReHoMM4 browser emitter
        run: bash converter/tools/build_web_emitter.sh build/converter-core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rehomm4-converter-core
          path: build/converter-core
          if-no-files-found: error
